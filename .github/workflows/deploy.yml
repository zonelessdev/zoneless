name: Deploy

# A merge to main deploys to test. Every other environment is deployed by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options:
          - test
          - cloud
          - selfhosted
        required: true

concurrency:
  group: deploy-${{ inputs.environment || 'test' }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'test' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'test' }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      API_URL: ${{ secrets.API_URL }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      HAS_CANARY: ${{ secrets.CANARY_API_KEY != '' }}
    steps:
      # The Cloud Run address is built from the project number, so keep both
      # out of the public run log. LOG_MASKS is an optional list of extra words
      # to hide.
      - name: Mask identifying values
        run: |
          echo "::add-mask::$(echo "$WIF_PROVIDER" | cut -d/ -f2)"
          for word in $LOG_MASKS; do echo "::add-mask::$word"; done
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          LOG_MASKS: ${{ secrets.LOG_MASKS }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # Same as the manual deploy: Cloud Run installs from package.json alone.
      - name: Build API
        run: |
          npx nx build api
          rm -f dist/apps/api/package-lock.json

      # No --set-env-vars: the service keeps the configuration it already has.
      # After a manual rollback, traffic stays pinned to the old revision
      # until it is pointed back at the latest one.
      - name: Deploy API to Cloud Run
        run: |
          set -o pipefail
          HideServiceUrl() {
            sed -uE 's#https://[A-Za-z0-9.-]+\.run\.app#[service URL hidden]#g'
          }
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --source dist/apps/api \
            --quiet 2>&1 | HideServiceUrl
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --to-latest \
            --quiet 2>&1 | HideServiceUrl

      - name: Build dashboard
        run: |
          sed "s|apiUrl: ''|apiUrl: '$API_URL'|" \
            apps/web/src/environments/environment.prod.example.ts \
            > apps/web/src/environments/environment.prod.ts
          npx nx build web --configuration=production

      - name: Deploy dashboard to Firebase Hosting
        run: |
          cp .github/deploy/hosting.json firebase.json
          npx firebase-tools@15 deploy --only hosting --project "$GCP_PROJECT" --non-interactive

      - name: Check API health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "${API_URL%/v1}/api/health" | grep '"mongodb":"connected"'

      # One real one-cent payment, for environments set up with
      # scripts/setup-canary.sh.
      - name: Check a live payment
        if: env.HAS_CANARY == 'true'
        run: npx nx run api-e2e:canary
        env:
          CANARY_API_URL: ${{ secrets.API_URL }}
          CANARY_API_KEY: ${{ secrets.CANARY_API_KEY }}
          CANARY_WALLET_SECRET_KEY: ${{ secrets.CANARY_WALLET_SECRET_KEY }}
