name: Deploy

# A merge to main deploys to test. Cloud and selfhosted are deployed by hand
# for now: a manual run deploys one environment.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options:
          - test
          - cloud
          - selfhosted
        required: true
      everything:
        description: Deploy the API and dashboard even if unchanged
        type: boolean
        default: false

# One deploy run at a time. If several are waiting, only the newest runs.
concurrency:
  group: deploy

permissions:
  contents: read
  deployments: read
  id-token: write

# `secrets: inherit` is what lets each job read its environment's secrets
# inside the called workflow. Without it they arrive empty.

jobs:
  test:
    name: Test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.environment == 'test')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: test
      everything: ${{ inputs.everything == true }}
    secrets: inherit

  cloud:
    name: Cloud
    needs: test
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      inputs.environment == 'cloud'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: cloud
      everything: ${{ inputs.everything == true }}
    secrets: inherit

  selfhosted:
    name: Selfhosted
    needs: cloud
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      inputs.environment == 'selfhosted'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: selfhosted
      everything: ${{ inputs.everything == true }}
    secrets: inherit
