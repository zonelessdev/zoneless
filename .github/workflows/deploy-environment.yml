name: Deploy Environment

# Deploys one environment. Called by deploy.yml.
#
# Only the apps affected since the environment's last successful deployment
# are deployed. The API goes first: if its health check or live payment check
# fails, traffic returns to the revision that was serving before, and the
# dashboard is left as it was.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      everything:
        description: Deploy the API and dashboard even if unchanged
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      API_URL: ${{ secrets.API_URL }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      HAS_CANARY: ${{ secrets.CANARY_API_KEY != '' }}
      # gcloud prints the service's run.app address, which stays out of the log.
      HIDE_SERVICE_URL: 's#https://[A-Za-z0-9.-]+\.run\.app#[service URL hidden]#g'
    steps:
      # The Cloud Run address is built from the project number, so keep both
      # out of the public run log. The API's host name is masked too: curl
      # prints it when a health check cannot connect. LOG_MASKS is an optional
      # list of extra words to hide.
      - name: Mask identifying values
        run: |
          echo "::add-mask::$(echo "$WIF_PROVIDER" | cut -d/ -f2)"
          echo "::add-mask::$(echo "$API_URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          for word in $LOG_MASKS; do echo "::add-mask::$word"; done
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          LOG_MASKS: ${{ secrets.LOG_MASKS }}

      # Full history, to compare with the last deployed commit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Work out what to deploy
        id: changes
        run: |
          set -o pipefail
          if [[ "${{ inputs.everything }}" == "true" ]]; then
            printf 'api=true\nweb=true\n' | tee -a "$GITHUB_OUTPUT"
          else
            ./scripts/deploy-changes.sh "${{ inputs.environment }}" |
              tee -a "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Authenticate to Google Cloud
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.web == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.changes.outputs.api == 'true'
        uses: google-github-actions/setup-gcloud@v3

      # Cloud Run installs the API's dependencies when it builds the image.
      # Without a lockfile it picks the newest version of every indirect
      # dependency at that moment. This gives it a lockfile made from the
      # repository's own, so it installs the versions CI tested. It also names
      # the Node version: left unset, Cloud Run uses the newest it has.
      - name: Build API
        if: steps.changes.outputs.api == 'true'
        run: |
          npx nx build api
          cp package-lock.json dist/apps/api/package-lock.json
          cd dist/apps/api
          npm pkg set engines.node="$(cat ../../../.nvmrc).x"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Note the API revision in service
        if: steps.changes.outputs.api == 'true'
        run: |
          revision="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --format='value(status.traffic[0].revisionName)')"
          echo "PREVIOUS_REVISION=$revision" >> "$GITHUB_ENV"

      # No --set-env-vars: the service keeps the configuration it already has.
      # After a rollback, traffic stays pinned to the old revision until it is
      # pointed back at the latest one.
      - name: Deploy API to Cloud Run
        if: steps.changes.outputs.api == 'true'
        run: |
          set -o pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --source dist/apps/api \
            --quiet 2>&1 | sed -uE "$HIDE_SERVICE_URL"
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --to-latest \
            --quiet 2>&1 | sed -uE "$HIDE_SERVICE_URL"

      - name: Check API health
        id: health
        if: steps.changes.outputs.api == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "${API_URL%/v1}/api/health" | grep '"mongodb":"connected"'

      # One real one-cent payment, for environments set up with
      # scripts/setup-canary.sh. With the platform wallet's key as well, the
      # cent is then paid back out through a transfer and a payout.
      - name: Check a live payment
        id: canary
        if: steps.changes.outputs.api == 'true' && env.HAS_CANARY == 'true'
        run: npx nx run api-e2e:canary
        env:
          CANARY_API_URL: ${{ secrets.API_URL }}
          CANARY_API_KEY: ${{ secrets.CANARY_API_KEY }}
          CANARY_WALLET_SECRET_KEY: ${{ secrets.CANARY_WALLET_SECRET_KEY }}
          CANARY_PLATFORM_WALLET_SECRET_KEY: ${{ secrets.CANARY_PLATFORM_WALLET_SECRET_KEY }}

      # The new revision failed its checks: send traffic back to the one that
      # was serving before. The job still fails.
      - name: Roll back the API
        if: failure() && (steps.health.outcome == 'failure' || steps.canary.outcome == 'failure')
        run: |
          set -o pipefail
          if [[ -z "$PREVIOUS_REVISION" ]]; then
            echo "There is no earlier revision to return to."
            exit 1
          fi
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --to-revisions "$PREVIOUS_REVISION=100" \
            --quiet 2>&1 | sed -uE "$HIDE_SERVICE_URL"
          echo "- API: the new version failed its checks, so the previous version is serving again" >> "$GITHUB_STEP_SUMMARY"

      - name: Build dashboard
        if: steps.changes.outputs.web == 'true'
        run: |
          sed "s|apiUrl: ''|apiUrl: '$API_URL'|" \
            apps/web/src/environments/environment.prod.example.ts \
            > apps/web/src/environments/environment.prod.ts
          npx nx build web --configuration=production

      - name: Deploy dashboard to Firebase Hosting
        if: steps.changes.outputs.web == 'true'
        run: |
          cp .github/deploy/hosting.json firebase.json
          npx firebase-tools@15 deploy --only hosting --project "$GCP_PROJECT" --non-interactive

      - name: Summarise
        run: |
          echo "- API: ${{ steps.changes.outputs.api == 'true' && 'deployed' || 'unchanged, not deployed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dashboard: ${{ steps.changes.outputs.web == 'true' && 'deployed' || 'unchanged, not deployed' }}" >> "$GITHUB_STEP_SUMMARY"
